name: Review one MeshCore release
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      commit:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ inputs.tag }}
      commit: ${{ inputs.commit }}

  propose:
    needs: build
    if: always() && !cancelled() && (needs.build.result == 'success' || needs.build.result == 'failure')
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Open a draft update for review
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWER: ${{ vars.V3_REVIEWER }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
          RESULT: ${{ needs.build.result }}
          BASE: ${{ github.event.repository.default_branch }}
        run: bash .github/propose.sh
